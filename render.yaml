# Render Blueprint — SentinelGate AI as a single combined web service (Docker).
#
# One image (root ./Dockerfile) builds the React/Vite frontend and serves it
# together with the FastAPI API from one Uvicorn process. The browser uses
# relative /api/* URLs (same origin, no CORS, no separate frontend host).
#
# Deploy: push this repo to GitHub, then in Render choose "New +" → "Blueprint".
services:
  - type: web
    name: sentinelgate-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENABLE_HF_CLASSIFIER
        value: "false"
# NOTE on persistence: the Free plan has an EPHEMERAL filesystem with no
# persistent disk, so the SQLite audit log at /app/data/sentinelgate.db resets
# to the DEMO seed rows on every deploy/restart. This is fine for a demo.
# For durable storage, upgrade to a paid plan and add, under this service:
#   disk:
#     name: sentinelgate-data
#     mountPath: /var/data
#     sizeGB: 1
# then set envVar DATABASE_PATH=/var/data/sentinelgate.db (overrides the
# Dockerfile default).
